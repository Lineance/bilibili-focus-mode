name: CI - Windows and extension

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '21 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Check GitHub workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
  extension:
    uses: ./.github/workflows/extension-build.yml
  windows:
    needs: [extension, packaging-tests]
    uses: ./.github/workflows/native-monitor.yml
    with:
      long_run: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
