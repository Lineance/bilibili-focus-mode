name: Extension checks and build

on:
  workflow_call:
    inputs:
      package_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - name: Validate and package extension
        env:
          PACKAGE_TAG: ${{ inputs.package_tag }}
        run: |
          TAG_ARGS=()
          if [[ "$PACKAGE_TAG" == v* ]]; then TAG_ARGS=(--tag "$PACKAGE_TAG"); fi
          python .github/scripts/package_release.py build --component extension "${TAG_ARGS[@]}" --out .cache/release/extension
      - uses: actions/upload-artifact@v7
        with:
          name: extension-dist
          overwrite: true
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: extension-package
          overwrite: true
          path: .cache/release/extension/
          if-no-files-found: error
