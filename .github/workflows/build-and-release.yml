name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - 'monitor-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Check GitHub workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate the component version tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/package_release.py validate-tag --tag "$RELEASE_TAG"
  extension:
    needs: validate
    uses: ./.github/workflows/extension-build.yml
    with:
      package_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  windows:
    needs: [validate, extension]
    uses: ./.github/workflows/native-monitor.yml
    with:
      package_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      long_run: true
  release:
    name: Publish checked archives
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [extension, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: release
      - name: Generate the final archive checksum manifest
        run: python .github/scripts/package_release.py checksums --directory release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
